[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-ai"
version = "0.7.0"
description = "Local-first intelligent API testing desktop tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "PyMySQL>=1.1",
]

[project.optional-dependencies]
# PySide6 has no compatible wheel for Python 3.14 at the time of writing.
# Keeping it optional allows the headless CLI/CI runner to work on 3.14.
desktop = ["PySide6>=6.8"]
dev = ["pytest>=8.0"]

[project.scripts]
testpilot-ai = "testpilot.main:main"
testpilot-run = "testpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp", "-p", "no:cacheprovider"]
