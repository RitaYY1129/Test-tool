[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-ai"
version = "0.7.0"
description = "Local-first intelligent API testing desktop tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "cryptography>=44.0",
  "jsonschema>=4.23",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
testpilot-ai = "testpilot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp", "-p", "no:cacheprovider"]
